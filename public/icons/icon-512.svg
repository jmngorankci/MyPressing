<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#pwaGrad)"/>
  
  <!-- Motif bulles et propreté -->
  <circle cx="120" cy="110" r="28" fill="#ffffff" opacity="0.25"/>
  <circle cx="390" cy="140" r="18" fill="#ffffff" opacity="0.2"/>
  <circle cx="100" cy="380" r="22" fill="#ffffff" opacity="0.2"/>

  <!-- Logo Machine / Linge -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Forme machine à laver -->
    <rect x="20" y="20" width="260" height="260" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="6"/>
    <!-- Hublot -->
    <circle cx="150" cy="165" r="76" fill="#0284c7" stroke="#38bdf8" stroke-width="8"/>
    <circle cx="150" cy="165" r="54" fill="#0369a1"/>
    <!-- Vague d'eau / Mousse -->
    <path d="M 110 175 Q 130 155 150 175 T 190 175 A 54 54 0 0 1 110 175" fill="#bae6fd" opacity="0.8"/>
    <!-- Tiroir à lessive -->
    <rect x="42" y="44" width="60" height="24" rx="6" fill="#cbd5e1"/>
    <!-- Boutons commande -->
    <circle cx="215" cy="56" r="10" fill="#0ea5e9"/>
    <circle cx="245" cy="56" r="6" fill="#94a3b8"/>
  </g>

  <!-- Étoile d'éclat / Propreté étincelante -->
  <path d="M 370 70 Q 370 100 400 100 Q 370 100 370 130 Q 370 100 340 100 Q 370 100 370 70 Z" fill="#facc15"/>
</svg>
